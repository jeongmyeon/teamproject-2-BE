# AWS EFS CSI Driver를 사용한 공유 이미지 스토리지 설정

---
# EFS CSI Driver 설치 안내
# kubectl apply -k "github.com/kubernetes-sigs/aws-efs-csi-driver/deploy/kubernetes/overlays/stable/?ref=master"

---
# EFS 파일시스템 생성 (AWS Console 또는 CLI)
# aws efs create-file-system \
#   --performance-mode generalPurpose \
#   --throughput-mode bursting \
#   --encrypted \
#   --tags Key=Name,Value=biddy-images-efs

# EFS 마운트 타겟 생성 (각 AZ별)
# aws efs create-mount-target \
#   --file-system-id fs-xxxxx \
#   --subnet-id subnet-xxxxx \
#   --security-groups sg-xxxxx

---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: efs-sc
provisioner: efs.csi.aws.com
parameters:
  provisioningMode: efs-ap
  fileSystemId: fs-xxxxx  # 실제 EFS 파일시스템 ID로 교체
  directoryPerms: "777"
  gidRangeStart: "1000"
  gidRangeEnd: "2000"
  basePath: "/biddy-images"
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: biddy-images-pv
spec:
  capacity:
    storage: 100Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: efs-sc
  csi:
    driver: efs.csi.aws.com
    volumeHandle: fs-xxxxx  # 실제 EFS 파일시스템 ID로 교체
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: biddy-images-pvc
  namespace: biddy-services
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: efs-sc
  resources:
    requests:
      storage: 100Gi
