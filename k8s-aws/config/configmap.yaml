apiVersion: v1
kind: ConfigMap
metadata:
  name: biddy-common-config
  namespace: biddy-services
data:
  TZ: "Asia/Seoul"
  # Eureka Discovery (클러스터 내부)
  EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: "http://discovery.biddy-services.svc.cluster.local:8761/eureka/"

  # AWS RDS PostgreSQL (실제 값으로 교체 필요)
  POSTGRES_HOST: "biddy-postgres.xxxxx.ap-northeast-2.rds.amazonaws.com"
  POSTGRES_PORT: "5432"

  # AWS ElastiCache Redis (실제 값으로 교체 필요)
  REDIS_HOST: "biddy-redis.xxxxx.ng.0001.apne2.cache.amazonaws.com"
  REDIS_PORT: "6379"

  # AWS MSK Kafka (실제 값으로 교체 필요)
  KAFKA_BOOTSTRAP_SERVERS: "b-1.biddy-kafka.xxxxx.c2.kafka.ap-northeast-2.amazonaws.com:9092,b-2.biddy-kafka.xxxxx.c2.kafka.ap-northeast-2.amazonaws.com:9092,b-3.biddy-kafka.xxxxx.c2.kafka.ap-northeast-2.amazonaws.com:9092"

  # Database Names
  MEMBER_DB: "biddy_member"
  PRODUCT_DB: "biddy_product"
  ORDER_DB: "biddy_order"
  AUCTION_DB: "biddy_auction"
  PAYMENT_DB: "biddy_payment"

  # Image URL (ALB 도메인으로 교체)
  IMAGE_BASE_URL: "https://api.biddy.example.com/images"
