# 추천 서비스 (Recommendation Service)
# 머신러닝 기반 상품/경매 추천 엔진

apiVersion: v1
kind: Service
metadata:
  name: recommendation
  namespace: biddy-services
  labels:
    app: recommendation
spec:
  selector:
    app: recommendation
  ports:
    - name: http
      port: 8086
      targetPort: 8086
      protocol: TCP
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendation
  namespace: biddy-services
  labels:
    app: recommendation
spec:
  replicas: 2
  selector:
    matchLabels:
      app: recommendation
  template:
    metadata:
      labels:
        app: recommendation
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8086"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
      - name: recommendation
        image: YOUR_ACCOUNT_ID.dkr.ecr.ap-northeast-2.amazonaws.com/biddy/recommendation:v1.0.0
        ports:
        - containerPort: 8086
          name: http
        env:
        - name: TZ
          valueFrom:
            configMapKeyRef:
              name: biddy-common-config
              key: TZ
        - name: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
          valueFrom:
            configMapKeyRef:
              name: biddy-common-config
              key: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: biddy-common-config
              key: KAFKA_BOOTSTRAP_SERVERS
        - name: POSTGRES_HOST
          valueFrom:
            configMapKeyRef:
              name: biddy-common-config
              key: POSTGRES_HOST
        - name: POSTGRES_PORT
          valueFrom:
            configMapKeyRef:
              name: biddy-common-config
              key: POSTGRES_PORT
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: biddy-secrets
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: biddy-secrets
              key: POSTGRES_PASSWORD
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: biddy-common-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: biddy-common-config
              key: REDIS_PORT
        # 추천 모델 설정
        - name: MODEL_PATH
          value: "/models"
        - name: MODEL_UPDATE_INTERVAL
          value: "3600"  # 1시간마다 모델 재학습
        volumeMounts:
        - name: ml-models
          mountPath: /models
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8086
          initialDelaySeconds: 120
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8086
          initialDelaySeconds: 60
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1500m"  # ML 추론에 CPU 더 필요
      volumes:
      - name: ml-models
        persistentVolumeClaim:
          claimName: recommendation-models-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: recommendation-models-pvc
  namespace: biddy-services
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp3
  resources:
    requests:
      storage: 10Gi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: recommendation-hpa
  namespace: biddy-services
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: recommendation
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
---
# CronJob: 매일 새벽 3시에 추천 모델 재학습
apiVersion: batch/v1
kind: CronJob
metadata:
  name: recommendation-training
  namespace: biddy-services
spec:
  schedule: "0 3 * * *"  # 매일 새벽 3시
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: training
            image: YOUR_ACCOUNT_ID.dkr.ecr.ap-northeast-2.amazonaws.com/biddy/recommendation-training:v1.0.0
            env:
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: biddy-common-config
                  key: POSTGRES_HOST
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: biddy-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: biddy-secrets
                  key: POSTGRES_PASSWORD
            - name: MODEL_OUTPUT_PATH
              value: "/models/latest"
            volumeMounts:
            - name: ml-models
              mountPath: /models
            resources:
              requests:
                memory: "2Gi"
                cpu: "1000m"
              limits:
                memory: "4Gi"
                cpu: "2000m"
          volumes:
          - name: ml-models
            persistentVolumeClaim:
              claimName: recommendation-models-pvc
          restartPolicy: OnFailure
