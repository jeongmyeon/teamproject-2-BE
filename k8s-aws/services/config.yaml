apiVersion: v1
kind: Service
metadata:
  name: config
  namespace: biddy-services
  labels:
    app: config
spec:
  selector:
    app: config
  ports:
    - name: http
      port: 8888
      targetPort: 8888
      protocol: TCP
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config
  namespace: biddy-services
  labels:
    app: config
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config
  template:
    metadata:
      labels:
        app: config
    spec:
      containers:
      - name: config
        image: YOUR_ACCOUNT_ID.dkr.ecr.ap-northeast-2.amazonaws.com/biddy/config:v1.0.0
        ports:
        - containerPort: 8888
          name: http
        env:
        - name: TZ
          value: "Asia/Seoul"
        - name: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
          valueFrom:
            configMapKeyRef:
              name: biddy-common-config
              key: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8888
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8888
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
