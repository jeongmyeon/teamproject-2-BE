apiVersion: v1
kind: Service
metadata:
  name: member
  namespace: biddy-services
  labels:
    app: member
spec:
  selector:
    app: member
  ports:
    - name: http
      port: 8081
      targetPort: 8081
      protocol: TCP
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: member
  namespace: biddy-services
  labels:
    app: member
spec:
  replicas: 2
  selector:
    matchLabels:
      app: member
  template:
    metadata:
      labels:
        app: member
    spec:
      containers:
      - name: member
        image: YOUR_ACCOUNT_ID.dkr.ecr.ap-northeast-2.amazonaws.com/biddy/member:v1.0.0
        ports:
        - containerPort: 8081
          name: http
        env:
        - name: TZ
          valueFrom:
            configMapKeyRef:
              name: biddy-common-config
              key: TZ
        - name: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
          valueFrom:
            configMapKeyRef:
              name: biddy-common-config
              key: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: biddy-common-config
              key: KAFKA_BOOTSTRAP_SERVERS
        - name: POSTGRES_HOST
          valueFrom:
            configMapKeyRef:
              name: biddy-common-config
              key: POSTGRES_HOST
        - name: POSTGRES_PORT
          valueFrom:
            configMapKeyRef:
              name: biddy-common-config
              key: POSTGRES_PORT
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: biddy-secrets
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: biddy-secrets
              key: POSTGRES_PASSWORD
        - name: MEMBER_DB
          valueFrom:
            configMapKeyRef:
              name: biddy-common-config
              key: MEMBER_DB
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: biddy-secrets
              key: JWT_SECRET
        - name: MAIL_USERNAME
          valueFrom:
            secretKeyRef:
              name: biddy-secrets
              key: MAIL_USERNAME
        - name: MAIL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: biddy-secrets
              key: MAIL_PASSWORD
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8081
          initialDelaySeconds: 90
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8081
          initialDelaySeconds: 60
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: member-hpa
  namespace: biddy-services
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: member
  minReplicas: 2
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
