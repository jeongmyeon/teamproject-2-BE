apiVersion: v1
kind: Service
metadata:
  name: payment
  namespace: biddy-services
  labels:
    app: payment
spec:
  selector:
    app: payment
  ports:
    - name: http
      port: 8085
      targetPort: 8085
      protocol: TCP
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  namespace: biddy-services
  labels:
    app: payment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment
  template:
    metadata:
      labels:
        app: payment
    spec:
      containers:
      - name: payment
        image: YOUR_ACCOUNT_ID.dkr.ecr.ap-northeast-2.amazonaws.com/biddy/payment:v1.0.0
        ports:
        - containerPort: 8085
          name: http
        env:
        - name: TZ
          valueFrom:
            configMapKeyRef:
              name: biddy-common-config
              key: TZ
        - name: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
          valueFrom:
            configMapKeyRef:
              name: biddy-common-config
              key: EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: biddy-common-config
              key: KAFKA_BOOTSTRAP_SERVERS
        - name: POSTGRES_HOST
          valueFrom:
            configMapKeyRef:
              name: biddy-common-config
              key: POSTGRES_HOST
        - name: POSTGRES_PORT
          valueFrom:
            configMapKeyRef:
              name: biddy-common-config
              key: POSTGRES_PORT
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: biddy-secrets
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: biddy-secrets
              key: POSTGRES_PASSWORD
        - name: PAYMENT_DB
          valueFrom:
            configMapKeyRef:
              name: biddy-common-config
              key: PAYMENT_DB
        - name: ORDER_SERVICE_URL
          value: "http://order.biddy-services.svc.cluster.local:8083"
        - name: TOSS_PAYMENTS_BASE_URL
          valueFrom:
            secretKeyRef:
              name: biddy-secrets
              key: TOSS_PAYMENTS_BASE_URL
        - name: TOSS_PAYMENTS_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: biddy-secrets
              key: TOSS_PAYMENTS_SECRET_KEY
        - name: JAVA_TOOL_OPTIONS
          value: "-Duser.timezone=Asia/Seoul"
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8085
          initialDelaySeconds: 90
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8085
          initialDelaySeconds: 60
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: payment-hpa
  namespace: biddy-services
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: payment
  minReplicas: 2
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
