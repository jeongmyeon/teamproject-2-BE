apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: biddy-ingress
  namespace: biddy-gateway
  annotations:
    # AWS Load Balancer Controller 설정
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '30'
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: '5'
    alb.ingress.kubernetes.io/healthy-threshold-count: '2'
    alb.ingress.kubernetes.io/unhealthy-threshold-count: '3'

    # HTTPS 설정 (ACM 인증서 ARN으로 교체 필요)
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-northeast-2:YOUR_ACCOUNT_ID:certificate/YOUR_CERT_ID
    alb.ingress.kubernetes.io/ssl-redirect: '443'

    # 로드밸런서 속성
    alb.ingress.kubernetes.io/load-balancer-name: biddy-alb
    alb.ingress.kubernetes.io/target-group-attributes: stickiness.enabled=true,stickiness.lb_cookie.duration_seconds=3600

    # 태그
    alb.ingress.kubernetes.io/tags: Environment=production,Project=biddy
spec:
  ingressClassName: alb
  rules:
  - host: api.biddy.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: apigateway
            port:
              number: 8000
