server:
  port: 8000

spring:
  application:
    name: apigateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://localhost:*"
              - "http://127.0.0.1:*"
              - "https://biddy-zeta.vercel.app"
              - "https://*.vercel.app"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: member-service
          uri: lb://MEMBER-SERVICE
          predicates:
            - Path=/api/members/**
        - id: member-admin
          uri: lb://MEMBER-SERVICE
          predicates:
            - Path=/api/admin/**

        - id: product-service
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/api/products/**

        - id: search-service
          uri: lb://SEARCH-SERVICE
          predicates:
            - Path=/api/search/**

        - id: order-service
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/api/orders/**, /api/order/**, /api/cart/**

        - id: auction-service
          uri: lb://AUCTION-SERVICE
          predicates:
            - Path=/api/auctions/**, /api/v1/auctions/**, /api/v1/members/me/watches/**, /api/v1/members/me/bids/**

        - id: payment-service
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/api/payments/**

        - id: chat-service
          uri: lb://CHAT-SERVICE
          predicates:
            - Path=/api/chats/**

        - id: chat-service-websocket
          uri: lb:ws://CHAT-SERVICE
          predicates:
            - Path=/api/ws-chat/**

        - id: chatbot-service
          uri: lb://CHATBOT-SERVICE
          predicates:
            - Path=/api/chatbot/**

        # 각 서비스의 OpenAPI 스펙을 gateway 하나로 모아서 보기 위한 라우트
        # (gateway 자체의 /swagger-ui 에서 springdoc.swagger-ui.urls 로 이 경로들을 불러옴)
        - id: member-service-docs
          uri: lb://MEMBER-SERVICE
          predicates:
            - Path=/v3/api-docs/member-service
          filters:
            - RewritePath=/v3/api-docs/member-service, /v3/api-docs

        - id: product-service-docs
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/v3/api-docs/product-service
          filters:
            - RewritePath=/v3/api-docs/product-service, /v3/api-docs

        - id: search-service-docs
          uri: lb://SEARCH-SERVICE
          predicates:
            - Path=/v3/api-docs/search-service
          filters:
            - RewritePath=/v3/api-docs/search-service, /v3/api-docs

        - id: order-service-docs
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/v3/api-docs/order-service
          filters:
            - RewritePath=/v3/api-docs/order-service, /v3/api-docs

        - id: auction-service-docs
          uri: lb://AUCTION-SERVICE
          predicates:
            - Path=/v3/api-docs/auction-service
          filters:
            - RewritePath=/v3/api-docs/auction-service, /v3/api-docs

        - id: payment-service-docs
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/v3/api-docs/payment-service
          filters:
            - RewritePath=/v3/api-docs/payment-service, /v3/api-docs

        - id: chatbot-service-docs
          uri: lb://CHATBOT-SERVICE
          predicates:
            - Path=/v3/api-docs/chatbot-service
          filters:
            - RewritePath=/v3/api-docs/chatbot-service, /v3/api-docs

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway, metrics, prometheus
  metrics:
    export:
      prometheus:
        enabled: true


jwt:
  secret: ${JWT_SECRET:biddy-default-jwt-secret-key-for-development-only}

springdoc:
  swagger-ui:
    urls:
      - name: member-service
        url: /v3/api-docs/member-service
      - name: product-service
        url: /v3/api-docs/product-service
      - name: search-service
        url: /v3/api-docs/search-service
      - name: order-service
        url: /v3/api-docs/order-service
      - name: auction-service
        url: /v3/api-docs/auction-service
      - name: payment-service
        url: /v3/api-docs/payment-service
      - name: chatbot-service
        url: /v3/api-docs/chatbot-service
