# Payment Service CI
name: CI - Payment

on:
  push:
    branches: [ develop ]
    paths:
      - 'payment/**'
  pull_request:
    branches: [ develop ]
    paths:
      - 'payment/**'

concurrency:
  group: ci-payment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-payment-${{ hashFiles('payment/build.gradle') }}
          restore-keys: ${{ runner.os }}-gradle-payment-

      - name: Grant execute permission
        run: chmod +x payment/gradlew

      - name: Build and Test
        working-directory: payment
        run: ./gradlew build --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-payment
          path: payment/build/reports/tests/
          retention-days: 7

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && success()
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker image
        if: github.event_name == 'push' && success()
        run: |
          cd payment
          docker build -t ghcr.io/${{ github.repository_owner }}/payment:latest -t ghcr.io/${{ github.repository_owner }}/payment:${{ github.sha }} .
          docker push ghcr.io/${{ github.repository_owner }}/payment:latest
          docker push ghcr.io/${{ github.repository_owner }}/payment:${{ github.sha }}
