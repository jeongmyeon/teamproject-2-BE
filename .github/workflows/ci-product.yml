# Product Service CI
name: CI - Product

on:
  push:
    branches: [ develop ]
    paths:
      - 'product/**'
  pull_request:
    branches: [ develop ]
    paths:
      - 'product/**'

concurrency:
  group: ci-product-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-product-${{ hashFiles('product/build.gradle') }}
          restore-keys: ${{ runner.os }}-gradle-product-

      - name: Grant execute permission
        run: chmod +x product/gradlew

      - name: Build and Test
        working-directory: product
        run: ./gradlew build --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-product
          path: product/build/reports/tests/
          retention-days: 7

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && success()
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PAT }}

      - name: Build and Push Docker image
        if: github.event_name == 'push' && success()
        run: |
          cd product
          docker build -t ghcr.io/${{ github.repository_owner }}/product:latest -t ghcr.io/${{ github.repository_owner }}/product:${{ github.sha }} .
          docker push ghcr.io/${{ github.repository_owner }}/product:latest
          docker push ghcr.io/${{ github.repository_owner }}/product:${{ github.sha }}
