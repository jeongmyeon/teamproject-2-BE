# Chat Service CI
name: CI - Chat

on:
  push:
    branches: [ develop ]
    paths:
      - 'chat/**'
  pull_request:
    branches: [ develop ]
    paths:
      - 'chat/**'
  workflow_dispatch:

concurrency:
  group: ci-chat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-chat-${{ hashFiles('chat/build.gradle') }}
          restore-keys: ${{ runner.os }}-gradle-chat-

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build and Test
        run: ./gradlew :chat:build --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-chat
          path: chat/build/reports/tests/
          retention-days: 7

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && success()
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PAT }}

      - name: Build and Push Docker image
        if: github.event_name == 'push' && success()
        run: |
          cd chat
          docker build -t ghcr.io/${{ github.repository_owner }}/chat:latest -t ghcr.io/${{ github.repository_owner }}/chat:${{ github.sha }} .
          docker push ghcr.io/${{ github.repository_owner }}/chat:latest
          docker push ghcr.io/${{ github.repository_owner }}/chat:${{ github.sha }}
