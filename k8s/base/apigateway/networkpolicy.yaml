# apigateway는 Traefik이 실행되는 kube-system 네임스페이스에서만 외부 요청을 받는다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: apigateway-allow-ingress-nginx
spec:
  podSelector:
    matchLabels:
      app: apigateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 8000
