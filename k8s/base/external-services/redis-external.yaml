---
# Service: K8s 내부에서 'redis:6379'로 접근
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: biddy
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP

---
# Endpoint: Docker 호스트 IP를 지정
apiVersion: v1
kind: Endpoints
metadata:
  name: redis
  namespace: biddy
subsets:
  - addresses:
      - ip: 10.0.30.99  # AWS EC2 Private IP
    ports:
      - name: redis
        port: 6379
        protocol: TCP
