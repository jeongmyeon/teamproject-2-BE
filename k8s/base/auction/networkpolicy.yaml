# auction은 다른 서비스가 직접 호출하지 않으므로 apigateway에서만 접근 허용
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: auction-allow-apigateway
spec:
  podSelector:
    matchLabels:
      app: auction
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: apigateway
      ports:
        - protocol: TCP
          port: 8084
